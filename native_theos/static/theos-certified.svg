<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Radial background glow -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#1a1a3a"/>
      <stop offset="100%" stop-color="#06060f"/>
    </radialGradient>
    <!-- Gold gradient for main elements -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5d980"/>
      <stop offset="40%" stop-color="#c9a84c"/>
      <stop offset="100%" stop-color="#8a6520"/>
    </linearGradient>
    <!-- Gold gradient horizontal (for THEOS text) -->
    <linearGradient id="goldText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fce89a"/>
      <stop offset="50%" stop-color="#d4a83a"/>
      <stop offset="100%" stop-color="#9a7020"/>
    </linearGradient>
    <!-- Globe gradient -->
    <radialGradient id="globeGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#e8b44a"/>
      <stop offset="50%" stop-color="#c47820"/>
      <stop offset="100%" stop-color="#5a3008"/>
    </radialGradient>
    <!-- Outer ring glow filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feBlend in="SourceGraphic" in2="blur" mode="screen"/>
    </filter>
    <!-- Arc text paths -->
    <path id="topArc" d="M 80,250 A 170,170 0 1,1 420,250" fill="none"/>
    <path id="bottomArc" d="M 95,295 A 160,160 0 0,0 405,295" fill="none"/>
  </defs>

  <!-- Background circle -->
  <circle cx="250" cy="250" r="240" fill="url(#bgGrad)"/>

  <!-- Outer decorative ring — gold, dotted pattern -->
  <circle cx="250" cy="250" r="235" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.6"/>
  <!-- Dot ring -->
  <circle cx="250" cy="250" r="228" fill="none" stroke="url(#goldGrad)" stroke-width="1"
          stroke-dasharray="3 7.2" opacity="0.8"/>
  <!-- Main gold border ring -->
  <circle cx="250" cy="250" r="218" fill="none" stroke="url(#goldGrad)" stroke-width="6"
          filter="url(#goldGlow)"/>
  <!-- Inner subtle ring -->
  <circle cx="250" cy="250" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.4"/>

  <!-- ── EYE SYMBOL ── -->
  <!-- Diamond / eye outline -->
  <path d="M 250,100 L 330,175 L 250,195 L 170,175 Z"
        fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linejoin="round"/>
  <!-- Eye lids (almond shape) -->
  <path d="M 170,175 Q 210,138 250,142 Q 290,138 330,175 Q 290,212 250,208 Q 210,212 170,175 Z"
        fill="none" stroke="url(#goldGrad)" stroke-width="3.5"/>
  <!-- Globe (iris) -->
  <circle cx="250" cy="175" r="28" fill="url(#globeGrad)"/>
  <!-- Globe lines -->
  <ellipse cx="250" cy="175" rx="28" ry="11" fill="none" stroke="#f5d98088" stroke-width="1"/>
  <line x1="222" y1="175" x2="278" y2="175" stroke="#f5d98088" stroke-width="1"/>
  <line x1="233" y1="148" x2="267" y2="202" stroke="#f5d98066" stroke-width="0.8"/>
  <line x1="267" y1="148" x2="233" y2="202" stroke="#f5d98066" stroke-width="0.8"/>
  <!-- Globe sheen -->
  <circle cx="242" cy="165" r="9" fill="white" opacity="0.18"/>

  <!-- Crescent moon (top right of eye) -->
  <path d="M 308,128 Q 325,118 330,135 Q 318,130 308,145 Q 300,128 308,128 Z"
        fill="url(#goldGrad)" opacity="0.9"/>

  <!-- Stars -->
  <!-- Top-left star -->
  <polygon points="193,130 196,122 199,130 207,130 201,135 203,143 196,138 189,143 191,135 185,130"
           fill="url(#goldGrad)" opacity="0.85" transform="scale(0.7) translate(83,60)"/>
  <!-- Right star small -->
  <polygon points="315,205 317,200 319,205 324,205 320,208 321,213 317,210 313,213 314,208 310,205"
           fill="url(#goldGrad)" opacity="0.7"/>

  <!-- ── COLUMN ── -->
  <!-- Capital (top) -->
  <path d="M 224,215 Q 250,210 276,215 L 272,222 L 228,222 Z" fill="url(#goldGrad)"/>
  <!-- Scrolls on capital -->
  <path d="M 228,222 Q 224,226 228,230 Q 232,234 236,230" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
  <path d="M 272,222 Q 276,226 272,230 Q 268,234 264,230" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
  <!-- Capital base bar -->
  <rect x="224" y="228" width="52" height="5" rx="1" fill="url(#goldGrad)"/>
  <!-- Shaft fluting (4 lines) -->
  <rect x="234" y="233" width="5" height="42" rx="2" fill="url(#goldGrad)"/>
  <rect x="242" y="233" width="5" height="42" rx="2" fill="url(#goldGrad)"/>
  <rect x="250" y="233" width="5" height="42" rx="2" fill="url(#goldGrad)"/>
  <rect x="258" y="233" width="5" height="42" rx="2" fill="url(#goldGrad)"/>
  <!-- Base platform -->
  <rect x="222" y="275" width="56" height="6" rx="1" fill="url(#goldGrad)"/>
  <rect x="218" y="281" width="64" height="5" rx="1" fill="url(#goldGrad)" opacity="0.7"/>

  <!-- ── THEOS TEXT ── -->
  <text x="250" y="348"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="78"
        font-weight="bold"
        letter-spacing="4"
        text-anchor="middle"
        fill="url(#goldText)"
        filter="url(#softGlow)">THEOS</text>

  <!-- Thin rule under THEOS -->
  <line x1="130" y1="358" x2="370" y2="358" stroke="url(#goldGrad)" stroke-width="1" opacity="0.5"/>

  <!-- ── CERTIFIED TEXT ── -->
  <text x="250" y="392"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="32"
        font-weight="bold"
        letter-spacing="8"
        text-anchor="middle"
        fill="url(#goldText)">CERTIFIED</text>

  <!-- ── ARC TEXT: TOP — FREDERICK DAVIS STALNECKER ── -->
  <text font-family="'Arial Narrow', Arial, sans-serif" font-size="13.5" font-weight="600"
        letter-spacing="3.5" fill="#d4a83a" opacity="0.9">
    <textPath href="#topArc" startOffset="17%">FREDERICK DAVIS STALNECKER</textPath>
  </text>

  <!-- ── ARC TEXT: BOTTOM — PATENT INFO ── -->
  <text font-family="'Arial Narrow', Arial, sans-serif" font-size="11.5" font-weight="500"
        letter-spacing="1.8" fill="#c9a84c" opacity="0.85">
    <textPath href="#bottomArc" startOffset="8%">U.S. PATENT PENDING  ·  APP. NO. 18/919,771</textPath>
  </text>

  <!-- Subtle inner glow ring at border -->
  <circle cx="250" cy="250" r="218" fill="none" stroke="#f5d980" stroke-width="1" opacity="0.2"/>
</svg>
